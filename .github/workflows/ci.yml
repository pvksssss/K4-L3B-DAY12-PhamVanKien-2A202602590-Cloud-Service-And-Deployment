name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        env:
          AGENT_API_KEY: ci-dummy-key
          REDIS_URL: fake://
        run: >-
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
      - name: Deploy application
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx -y @railway/cli@5.63.1 up --service day12-agent --detach
      - name: Verify production health
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${{ vars.PUBLIC_URL }}/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
